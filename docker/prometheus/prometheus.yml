global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "event_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "event_worker"
    static_configs:
      - targets: ["worker:8001"]
    metrics_path: "/"

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

